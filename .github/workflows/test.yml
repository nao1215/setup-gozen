name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Static checks - these always run.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ShellCheck
        # -x lets ShellCheck follow the sourced scripts from the tests.
        run: shellcheck -x scripts/*.sh

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  # Unit tests of the scripts on every OS: macOS runs bash 3.2 and Windows runs
  # Git Bash, so portability problems show up here without a download.
  unit:
    name: Unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test version resolution
        shell: bash
        run: bash scripts/version_test.sh

      - name: Test go.mod parsing
        shell: bash
        run: bash scripts/gomod_test.sh

      - name: Test go-mod-path safety (directory traversal)
        shell: bash
        run: bash scripts/path_test.sh

      - name: Test checksum verification
        shell: bash
        run: bash scripts/checksum_test.sh

      - name: Test release tag normalization
        shell: bash
        run: bash scripts/release_meta_test.sh

  # End-to-end: install the real v0.2.0 release on every supported platform
  # and run it.
  install:
    name: Install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup gozen (explicit version)
        id: explicit
        uses: ./
        with:
          version: v0.2.0

      - name: Check the explicit install (bash)
        shell: bash
        env:
          VERSION: ${{ steps.explicit.outputs.version }}
          GOZEN_PATH: ${{ steps.explicit.outputs.gozen-path }}
        run: |
          set -euo pipefail
          echo "version=${VERSION}"
          echo "gozen-path=${GOZEN_PATH}"
          [ "${VERSION}" = "v0.2.0" ]
          command -v gozen
          gozen --version | tee version.txt
          grep -q "0.2.0" version.txt

      - name: Check the explicit install (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command gozen
          gozen --version

      - name: Setup gozen (from go.mod at the workspace root of a fixture)
        id: gomod
        uses: ./
        with:
          go-mod-path: test/fixtures/game

      - name: Check the go.mod install, served from the tool cache
        shell: bash
        env:
          VERSION: ${{ steps.gomod.outputs.version }}
          CACHE_HIT: ${{ steps.gomod.outputs.cache-hit }}
        run: |
          set -euo pipefail
          [ "${VERSION}" = "v0.2.0" ]
          [ "${CACHE_HIT}" = "true" ]
          gozen --version | grep -q "0.2.0"

      - name: Setup gozen (go.mod in a monorepo subdirectory, by file path)
        id: monorepo
        uses: ./
        with:
          go-mod-path: test/fixtures/monorepo/games/rpg/go.mod

      - name: Check the monorepo install
        shell: bash
        env:
          VERSION: ${{ steps.monorepo.outputs.version }}
        run: |
          set -euo pipefail
          [ "${VERSION}" = "v0.2.0" ]
          gozen --version | grep -q "0.2.0"

      # The leading v is optional, and install-dir copies the binary out of the
      # tool cache instead of putting the cache path on PATH.
      - name: Setup gozen (version without the leading v, custom install-dir)
        id: vless
        uses: ./
        with:
          version: 0.2.0
          install-dir: ${{ runner.temp }}/gozen-pinned

      - name: Check the v-less install
        shell: bash
        env:
          VERSION: ${{ steps.vless.outputs.version }}
          GOZEN_PATH: ${{ steps.vless.outputs.gozen-path }}
          INSTALL_DIR: ${{ steps.vless.outputs.install-dir }}
          CACHE_HIT: ${{ steps.vless.outputs.cache-hit }}
          WANT_DIR: ${{ runner.temp }}/gozen-pinned
        run: |
          set -euo pipefail
          [ "${VERSION}" = "v0.2.0" ] || { echo "version output: ${VERSION}" >&2; exit 1; }
          [ "${CACHE_HIT}" = "true" ] || { echo "cache-hit output: ${CACHE_HIT}" >&2; exit 1; }
          # Outputs are native paths; compare them in the same form.
          want="${WANT_DIR}"
          if command -v cygpath >/dev/null 2>&1; then want="$(cygpath -w "${WANT_DIR}")"; fi
          [ "${INSTALL_DIR}" = "${want}" ] || { echo "install-dir output: ${INSTALL_DIR} (want ${want})" >&2; exit 1; }
          [ -x "${GOZEN_PATH}" ] || { echo "gozen-path is not executable: ${GOZEN_PATH}" >&2; exit 1; }
          "${GOZEN_PATH}" --version | grep -q "0.2.0"

      - name: Setup gozen (latest)
        id: latest
        uses: ./
        with:
          version: latest

      - name: Check the latest install
        shell: bash
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          echo "latest resolved to ${VERSION}"
          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]
          gozen --version | grep -q "${VERSION#v}"


  # Every input the action must refuse, on Linux and on Windows (where Git Bash
  # sees drive letters and backslashes): each setup step has to fail, and no
  # gozen may end up on PATH. v0.0.0 is well-formed but was never released, so
  # it fails at the download instead of at validation.
  reject:
    name: Reject invalid inputs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup gozen, expected to fail: Parent directory in go-mod-path"
        id: parent
        continue-on-error: true
        uses: ./
        with:
          go-mod-path: ../../etc

      - name: "Setup gozen, expected to fail: Absolute go-mod-path"
        id: absolute
        continue-on-error: true
        uses: ./
        with:
          go-mod-path: /etc

      - name: "Setup gozen, expected to fail: Backslash parent directory in go-mod-path"
        id: winsep
        continue-on-error: true
        uses: ./
        with:
          go-mod-path: '..\..\etc'

      - name: "Setup gozen, expected to fail: Drive letter in go-mod-path"
        id: drive
        continue-on-error: true
        uses: ./
        with:
          go-mod-path: 'C:\Windows'

      - name: "Setup gozen, expected to fail: go.mod replacing gozen with a local path"
        id: localreplace
        continue-on-error: true
        uses: ./
        with:
          go-mod-path: test/fixtures/local-replace

      - name: "Setup gozen, expected to fail: go.mod pinning a pseudo-version"
        id: pseudo
        continue-on-error: true
        uses: ./
        with:
          go-mod-path: test/fixtures/pseudo

      - name: "Setup gozen, expected to fail: Version without a patch component"
        id: short
        continue-on-error: true
        uses: ./
        with:
          version: v0.2

      - name: "Setup gozen, expected to fail: Upper-case V prefix"
        id: upper
        continue-on-error: true
        uses: ./
        with:
          version: V0.2.0

      - name: "Setup gozen, expected to fail: Branch name as version"
        id: branch
        continue-on-error: true
        uses: ./
        with:
          version: main

      - name: "Setup gozen, expected to fail: Release that was never published"
        id: missing
        continue-on-error: true
        uses: ./
        with:
          version: v0.0.0

      - name: Every setup step must have failed and left nothing on PATH
        shell: bash
        env:
          OUTCOME_PARENT: ${{ steps.parent.outcome }}
          OUTCOME_ABSOLUTE: ${{ steps.absolute.outcome }}
          OUTCOME_WINSEP: ${{ steps.winsep.outcome }}
          OUTCOME_DRIVE: ${{ steps.drive.outcome }}
          OUTCOME_LOCALREPLACE: ${{ steps.localreplace.outcome }}
          OUTCOME_PSEUDO: ${{ steps.pseudo.outcome }}
          OUTCOME_SHORT: ${{ steps.short.outcome }}
          OUTCOME_UPPER: ${{ steps.upper.outcome }}
          OUTCOME_BRANCH: ${{ steps.branch.outcome }}
          OUTCOME_MISSING: ${{ steps.missing.outcome }}
        run: |
          set -euo pipefail
          status=0
          for name in $(compgen -A variable OUTCOME_); do
            if [ "${!name}" = "failure" ]; then
              echo "ok:   ${name#OUTCOME_} failed"
            else
              echo "FAIL: ${name#OUTCOME_} -> ${!name}" >&2
              status=1
            fi
          done
          if command -v gozen >/dev/null 2>&1; then
            echo "FAIL: gozen is on PATH after failed installs: $(command -v gozen)" >&2
            status=1
          fi
          exit "${status}"
